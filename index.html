<script type="module">

window.__v8ok=true;
const $=id=>document.getElementById(id);
const PI=Math.PI,TAU=PI*2;
const fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};

/* ===== device budget ===== */
const MOBILE=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<700;
const Q=MOBILE?{dpr:Math.min(devicePixelRatio,1.5),strands:1,dotStep:2.4,bloomRes:.5,ember:.35,aa:false}
              :{dpr:Math.min(devicePixelRatio,2),strands:3,dotStep:1.4,bloomRes:1,ember:1,aa:true};

/* ===== shareable state ===== */
const qs=new URLSearchParams(location.search);
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const cleanTxt=s=>(s||'').toUpperCase().replace(/[^A-Z0-9 :]/g,'').slice(0,16);
let TXT=cleanTxt(qs.has('t')?qs.get('t'):lsGet('v8txt','MRLDWRLD'));
const parsePal=s=>{const p=(s||'').split('-').map(h=>h.trim().replace('#',''));return p.length===3&&p.every(h=>/^[0-9a-fA-F]{6}$/.test(h))?p.map(h=>'#'+h.toLowerCase()):null};
let PAL=parsePal(qs.get('c'))||parsePal(lsGet('v8pal',''))||['#ffebcc','#ffebcc','#ffebcc'];
function syncShare(){
  const c=PAL.map(x=>x.slice(1)).join('-');lsSet('v8txt',TXT);lsSet('v8pal',c);
  try{const u=new URL(location.href);u.searchParams.set('t',TXT);u.searchParams.set('c',c);history.replaceState(null,'',u)}catch(e){}
}

/* ===== renderer ===== */
const renderer=new THREE.WebGLRenderer({antialias:Q.aa,powerPreference:'high-performance',preserveDrawingBuffer:false});

const scene=new THREE.Scene();scene.background=new THREE.Color(0x07080a);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,9000);
camera.position.set(0,0,300);

composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth*Q.bloomRes,innerHeight*Q.bloomRes),.6,.5,.1);
composer.addPass(bloom);composer.addPass(new OutputPass());

/* ===== uniforms + materials =====

   The flash on top is gentle and settles into that steady glow. */
const U={uT:{value:-10},uS:{value:-1e5},uDim:{value:.085},uLit:{value:.85},uGain:{value:1},uZoom:{value:1},uPx:{value:1},
  uC1:{value:new THREE.Color(PAL[0])},uC2:{value:new THREE.Color(PAL[1])},uC3:{value:new THREE.Color(PAL[2])},uR0:{value:20},uR1:{value:200}};
const COMMON=`uniform vec3 uC1;uniform vec3 uC2;uniform vec3 uC3;uniform float uR0;uniform float uR1;uniform float uZoom;uniform float uGain;
vec3 ombre(vec3 p){float f=clamp((length(p.xy)-uR0)/max(uR1-uR0,1.),0.,1.);return f<.5?mix(uC1,uC2,f*2.):mix(uC2,uC3,f*2.-1.);}
float fadeD(float d){return mix(clamp(1.4-d/400.,.4,1.),1.,uZoom);}`;
const addMat=o=>new THREE.ShaderMaterial(Object.assign({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending},o));
const lineMat=addMat({
vertexShader:`${COMMON}
uniform float uT;uniform float uDim;uniform float uLit;
attribute float tv;attribute float br;varying vec3 vC;varying float vA;
void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;
float dt=uT-tv;float lit=step(0.,dt);float fl=lit*exp(-max(dt,0.)*3.2);
float held=uLit*(1.-.3*uZoom);
vA=(mix(uDim*(1.+uZoom*2.),held,lit)+fl*.6*uGain)*br*fadeD(-mv.z);
vC=mix(ombre(position),vec3(1.,.97,.9),clamp(fl,0.,1.)*.7);}`,
fragmentShader:`varying vec3 vC;varying float vA;void main(){gl_FragColor=vec4(vC*vA,1.);}`});
const pointMat=addMat({
vertexShader:`${COMMON}
uniform float uT;uniform float uDim;uniform float uLit;uniform float uPx;
attribute float tv;attribute float br;attribute float sz;attribute float kind;attribute vec3 vel;
varying vec3 vC;varying float vA;
void main(){float dt=uT-tv;float lit=step(0.,dt);vec3 p=position;float a;float s=sz;float hot;
if(kind>.5){float e=max(dt,0.);p+=vel*(1.-exp(-e*2.))*1.2;a=lit*exp(-e*1.8)*step(e,2.5)*br;s*=1.-min(e*.3,.7);hot=.7;}
else{float fl=lit*exp(-max(dt,0.)*3.);float held=uLit*(1.-.3*uZoom);
a=(mix(uDim*1.3*(1.+uZoom*2.),held,lit)+fl*.6*uGain)*br;s*=1.+fl*1.;hot=clamp(fl,0.,1.)*.7;}
vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;
vA=a*fadeD(-mv.z);gl_PointSize=clamp(s*uPx*260./max(-mv.z,1.),1.,72.);
vC=mix(ombre(position),vec3(1.,.96,.88),hot);}`,
fragmentShader:`varying vec3 vC;varying float vA;void main(){vec2 c=gl_PointCoord-.5;float d=length(c);if(d>.5)discard;float f=smoothstep(.5,.05,d);gl_FragColor=vec4(vC*vA*f*1.5,1.);}`});
const glassMat=addMat({side:THREE.DoubleSide,
vertexShader:`${COMMON}
uniform float uS;attribute float ss;attribute float ed;varying vec3 vC;varying float vA;
void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;
float d=uS-ss;float near=exp(-abs(d)/18.);float past=step(0.,d);
vA=(.005+.009*past+.022*near)*(.35+.65*ed)*fadeD(-mv.z)*mix(1.,.5,uZoom)*uGain;vC=ombre(position);}`,
fragmentShader:`varying vec3 vC;varying float vA;void main(){gl_FragColor=vec4(vC*vA,1.);}`});

/* ===== seeded random (same song = same map) ===== */
let rng=Math.random;
const seedRng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

const SPEED=9,R0=34,PITCH=32,K=PITCH/TAU;
let Ltrack=1,ZSPAN=40,RMAX=80;
const thOf=s=>(-R0+Math.sqrt(R0*R0+2*K*Math.max(s,0)))/K;
const sOfTh=th=>R0*th+K*th*th/2;

function wp(s,h,d){const th=thOf(s),r=R0+K*th+h,ph=PI/2-th;return[Math.cos(ph)*r,Math.sin(ph)*r,zOf(s)+d]}
function basis(s){const th=thOf(s),ph=PI/2-th,c=Math.cos(ph),n=Math.sin(ph);return{N:[c,n],T:[n,-c],r:R0+K*th,c,n}}

  return{T:b.T,N:b.N,f:(gx,gy)=>[cx+b.T[0]*gx+b.N[0]*gy,cy+b.T[1]*gx+b.N[1]*gy,z]}}

/* ===== glass panes: one flat pane per sound ===== */
const PANES=[

  {id:'mel',   h:2.8, w:2.2, d:2},

/* ===== stroke font ===== */
const FONT={A:'0,0 0,4 2,6 4,4 4,0|0,3 4,3',B:'0,0 0,6 3,6 4,5 4,4 3,3 0,3|3,3 4,2 4,1 3,0 0,0',C:'4,5 3,6 1,6 0,5 0,1 1,0 3,0 4,1',
D:'0,0 0,6 3,6 4,5 4,1 3,0 0,0',E:'4,6 0,6 0,0 4,0|0,3 3,3',F:'4,6 0,6 0,0|0,3 3,3',G:'4,5 3,6 1,6 0,5 0,1 1,0 3,0 4,1 4,3 2,3',

W:'0,6 1,0 2,4 3,0 4,6',X:'0,0 4,6|0,6 4,0',Y:'0,6 2,3 4,6|2,3 2,0',Z:'0,6 4,6 0,0 4,0',

/* ===== hieroglyphs ===== */
const arc=(cx,cy,rx,ry,a0,a1,n=16)=>{const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return o};

const sy=snakeBody[snakeBody.length-1][1];
const WING=[[-.3,.12],[-.55,.32],[-1,.42],[-.9,.25],[-1,.18],[-.8,.05],[-.92,-.05],[-.6,-.05],[-.3,.02]];
const LEGS=[[[-.4,-.05],[-.75,.15],[-.85,.4]],[[-.42,-.3],[-.82,-.35]],[[-.35,-.58],[-.7,-.88]]];

  eye:[arc(0,0,1,.45,PI,0,18),arc(0,0,1,.3,PI,TAU,18),arc(0,.02,.22,.22,0,TAU,14),[[-1,.62],[0,.74],[.95,.6]],[[-.12,-.3],[-.16,-.95]],

  feather:[[[0,-1],[.04,-.4],[.08,.3],[0,.9]],[[.04,-.75],[.4,-.35],[.52,.15],[.42,.6],[.15,.95],[0,.9]],[[0,.9],[-.22,.82],[-.3,.62]],

  snake:[snakeBody,[[.75,sy],[.92,sy+.14],[1,sy],[.92,sy-.14],[.75,sy]],[[1,sy],[1.12,sy+.06]],[[1,sy],[1.12,sy-.06]]],
  djed:[[[-.3,-1],[-.3,.25]],[[.3,-1],[.3,.25]],[[-.55,-1],[.55,-1]],[[-.3,.25],[.3,.25]],[[-.7,.34],[.7,.34]],[[-.7,.54],[.7,.54]],[[-.7,.74],[.7,.74]],[[-.7,.94],[.7,.94]]],

  scarab:[arc(0,-.2,.42,.55,0,TAU,18),[[0,-.75],[0,.35]],arc(0,.42,.2,.12,0,PI,8),arc(0,.82,.17,.17,0,TAU,12),...LEGS,...LEGS.map(mir)]};

/* ===== buffers ===== */
const mk=()=>({a:new Float32Array(1<<15),n:0});
function grow(b,k){if(b.n+k>b.a.length){let m=b.a.length*2;while(m<b.n+k)m*=2;const x=new Float32Array(m);x.set(b.a.subarray(0,b.n));b.a=x}}
const put3=(b,x,y,z)=>{grow(b,3);b.a[b.n++]=x;b.a[b.n++]=y;b.a[b.n++]=z};
const put1=(b,x)=>{grow(b,1);b.a[b.n++]=x};
const view=b=>b.a.slice(0,b.n);
const LB=()=>({p:mk(),t:mk(),b:mk()});
const PB=()=>({p:mk(),t:mk(),b:mk(),s:mk(),k:mk(),v:mk()});
function seg(L,q0,t0,q1,t1,br){put3(L.p,q0[0],q0[1],q0[2]);put1(L.t,t0);put1(L.b,br);put3(L.p,q1[0],q1[1],q1[2]);put1(L.t,t1);put1(L.b,br)}
function pt(P,q,tv,br,sz,kind=0,vx=0,vy=0,vz=0){put3(P.p,q[0],q[1],q[2]);put1(P.t,tv);put1(P.b,br);put1(P.s,sz);put1(P.k,kind);put3(P.v,vx,vy,vz)}
function poly(L,W,T,br,thick){
  const off=thick&&Q.strands>1?[0,.11,-.11]:[0],bb=thick&&Q.strands===1?br*1.5:br;
  for(let i=1;i<W.length;i++){const a=W[i-1],b=W[i];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,px=dy/l,py=-dx/l;
    for(const o of off)seg(L,[a[0]+px*o,a[1]+py*o,a[2]],T[i-1],[b[0]+px*o,b[1]+py*o,b[2]],T[i],o===0?bb:bb*.8)}}
function lineObj(L){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(view(L.p),3));
  g.setAttribute('tv',new THREE.BufferAttribute(view(L.t),1));g.setAttribute('br',new THREE.BufferAttribute(view(L.b),1));
  const o=new THREE.LineSegments(g,lineMat);o.frustumCulled=false;return o}
function pointObj(P){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(view(P.p),3));
  for(const[k,n]of[['tv','t'],['br','b'],['sz','s'],['kind','k']])g.setAttribute(k,new THREE.BufferAttribute(view(P[n]),1));
  g.setAttribute('vel',new THREE.BufferAttribute(view(P.v),3));const o=new THREE.Points(g,pointMat);o.frustumCulled=false;return o}

/* ===== shapes ===== */
function embers(P,R,c,tv,n,vmin,vmax){n=Math.round(n*Q.ember);for(let i=0;i<n;i++){const a=rng()*TAU,v=vmin+rng()*(vmax-vmin),ca=Math.cos(a),sa=Math.sin(a);
  pt(P,c,tv,1.1,1+rng(),1,(R.T[0]*ca+R.N[0]*sa)*v,(R.T[1]*ca+R.N[1]*sa)*v,0)}}
function glyph(L,P,name,pane,s0,tOn,br){
  const R=rig(s0,pane.h,pane.d),sc=pane.w*.92,map=(x,y)=>R.f(x*sc,y*sc);
  const bk=1.08,bl=.36;
  for(const[sx,sy]of[[-1,-1],[1,-1],[1,1],[-1,1]])poly(L,[map(sx*bk*1.25,sy*(bk-bl)),map(sx*bk*1.25,sy*bk),map(sx*(bk*1.25-bl),sy*bk)],[tOn,tOn+.09,tOn+.18],br*.6,false);
  const st=GLY[name];const lens=st.map(k=>{let l=0;for(let i=1;i<k.length;i++)l+=Math.hypot(k[i][0]-k[i-1][0],k[i][1]-k[i-1][1]);return l});
  const tot=lens.reduce((a,b)=>a+b,0)||1,dur=.75;let t=tOn+.18;
  st.forEach((k,si)=>{const W=[],T=[];let acc=0;for(let i=0;i<k.length;i++){if(i)acc+=Math.hypot(k[i][0]-k[i-1][0],k[i][1]-k[i-1][1]);W.push(map(k[i][0],k[i][1]));T.push(t+acc/tot*dur)}
    t+=lens[si]/tot*dur;poly(L,W,T,br,true)});
  embers(P,R,map(0,0),tOn+.95,14,1.2,3.4);
}
function node(L,P,pane,s0,v,tOn,str,br,rr,fan){
  const R=rig(s0,pane.h+v,pane.d),W=[],T=[];
  for(let i=0;i<=20;i++){const a=i/20*TAU+PI/2;W.push(R.f(Math.cos(a)*rr,Math.sin(a)*rr));T.push(tOn+i/20*.25)}
  poly(L,W,T,br,false);pt(P,R.f(0,0),tOn,br,2.4+str*1.6);
  if(fan){const k=3+Math.round(str*4),reach=Math.max(pane.w*.92-Math.abs(v)-rr,.2);
    for(let j=0;j<k;j++){const up=j%2?1:-1,a=PI/2*up+(rng()-.5)*1.3,ln=rr+(.35+.65*str)*reach*(.5+rng()*.5),c=Math.cos(a),s=Math.sin(a);
      const t1=tOn+.12+ln*.08;poly(L,[R.f(c*rr,s*rr),R.f(c*ln,s*ln)],[tOn+.12,t1],br*.6,false);pt(P,R.f(c*ln,s*ln),t1,br*.6,.9)}}
  embers(P,R,R.f(0,0),tOn+.02,6,.8,2.4);
}
function textRun(L,str,sLeft,pane,v,sc,br,burn){
  const adv=5.6*sc;let s=sLeft;
  for(const ch of str){const st=FONTP[ch];
    if(st&&st.length){const R=rig(s+2*sc,pane.h+v,pane.d),tOn=s/SPEED;let tot=0;
      for(const k of st)for(let i=1;i<k.length;i++)tot+=Math.hypot(k[i][0]-k[i-1][0],k[i][1]-k[i-1][1]);
      let acc=0;for(const k of st){const W=[],T=[];for(let i=0;i<k.length;i++){if(i)acc+=Math.hypot(k[i][0]-k[i-1][0],k[i][1]-k[i-1][1]);
        W.push(R.f((k[i][0]-2)*sc,(k[i][1]-3)*sc));T.push(tOn+acc/(tot||1)*burn)}poly(L,W,T,br,sc>1)}}
    s+=adv}
  return s}

/* ===== whole-song analysis ===== */
function makeFFT(N){const rev=new Uint32Array(N),bits=Math.log2(N);for(let i=0;i<N;i++){let r=0;for(let b=0;b<bits;b++)r|=((i>>b)&1)<<(bits-1-b);rev[i]=r}
  const co=new Float32Array(N/2),si=new Float32Array(N/2);for(let k=0;k<N/2;k++){co[k]=Math.cos(TAU*k/N);si[k]=Math.sin(TAU*k/N)}
  return(re,im)=>{for(let i=0;i<N;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
    for(let size=2;size<=N;size<<=1){const half=size>>1,step=N/size;
      for(let i=0;i<N;i+=size)for(let j=0,k=0;j<half;j++,k+=step){const l=i+j+half,tr=re[l]*co[k]+im[l]*si[k],ti=im[l]*co[k]-re[l]*si[k];
